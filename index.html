<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoBlocks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#f7f7f8;--surface:#fff;--text:#1a1b1f;--muted:#5f6368;--line:#e3e4e8;--hover:#ececf0;--accent:#2f6bff;--play:#1fa84f;--play-h:#188a40;--danger:#c0392b;
--font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;--top:56px;--side:240px;--nav:60px;--r:8px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--surface:#1b1c20;--text:#f2f3f5;--muted:#a1a5ad;--line:#2b2d33;--hover:#2a2c32;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#121316;--surface:#1b1c20;--text:#f2f3f5;--muted:#a1a5ad;--line:#2b2d33;--hover:#2a2c32;--danger:#ff7b6b}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body.playing{overflow:hidden}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:var(--font)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.search{flex:1;max-width:420px;min-width:0;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text);padding:0 16px;font:inherit}
.userbar{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.btn{height:36px;padding:0 16px;border:0;border-radius:var(--r);background:var(--accent);color:#fff;font:600 14px var(--font);cursor:pointer}
.btn-2{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--text);font:600 14px var(--font);cursor:pointer}
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--top))}
.sidebar{position:sticky;top:var(--top);align-self:start;height:calc(100vh - var(--top));padding:12px;background:var(--surface);border-right:1px solid var(--line)}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:var(--r);color:var(--text);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover,.nav a[aria-current="page"]{background:var(--hover)}
.nav svg{width:20px;height:20px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"] svg{stroke:var(--text)}
main{padding:24px 32px 48px;min-width:0}
h1{margin:0 0 24px;font-size:28px;font-weight:700;letter-spacing:-.02em}h2{margin:0 0 12px;font-size:20px;font-weight:700}.row{margin-bottom:32px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,184px);gap:12px;overflow-x:auto;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px 12px}
.card{display:block;color:inherit;text-decoration:none;border-radius:var(--r)}
.thumb{position:relative;aspect-ratio:16/9;width:100%;border-radius:var(--r);background:var(--hover) center/cover}
.tag{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:10px;background:rgba(20,22,28,.7);color:#fff;font-size:11px;font-weight:600}
.card-title{margin:8px 0 2px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-meta{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{height:34px;padding:0 16px;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--text);font:600 14px var(--font);cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.empty{color:var(--muted);padding:24px 0}
/* forms */
.form{display:grid;gap:18px;max-width:560px}
.field{display:grid;gap:6px;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.in{height:42px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:400 15px var(--font);width:100%}
textarea.in{height:84px;padding:10px 12px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:400;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt b{display:block}.opt span{color:var(--muted)}
.cols{display:flex;gap:10px}.cols label{width:44px;height:30px;border-radius:8px;cursor:pointer;border:3px solid transparent}
.cols input,.opt input{position:absolute;opacity:0;pointer-events:none}.opt input{position:static;opacity:1;pointer-events:auto;margin-top:3px}
.cols label:has(input:checked){border-color:var(--text)}
.err{color:var(--danger);min-height:18px;font-weight:500}
/* dialogs */
.dlg{width:min(480px,calc(100vw - 32px));padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);overflow:hidden}
.dlg::backdrop{background:rgba(0,0,0,.6)}.dlg[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dlg[open]{animation:none}}
.modal-thumb{aspect-ratio:16/9;background:var(--hover) center/cover}
.pad-b{padding:20px 24px 24px}.pad-b h2{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.muted{color:var(--muted);margin:0 0 12px}
.btn-play{width:100%;height:56px;border:0;border-radius:var(--r);background:var(--play);color:#fff;font:800 20px var(--font);letter-spacing:.04em;cursor:pointer}
.btn-play:hover{background:var(--play-h)}
.btn-ghost{margin-top:8px;width:100%;height:40px;border:0;background:none;color:var(--muted);font:600 14px var(--font);cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{height:48px;border:0;background:none;color:var(--muted);font:600 15px var(--font);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--accent)}
#auth form{display:grid;gap:14px}
/* responsive: bottom nav */
@media (max-width:1024px){
 .shell{grid-template-columns:1fr}
 .sidebar{position:fixed;inset:auto 0 0 0;height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);border-right:0;border-top:1px solid var(--line);z-index:20}
 .nav{grid-template-columns:repeat(5,1fr);height:var(--nav);gap:0}
 .nav a{flex-direction:column;justify-content:center;gap:2px;height:100%;padding:0;font-size:11px;font-weight:600;border-radius:0;background:none!important}
 .nav a[aria-current="page"],.nav a[aria-current="page"] svg{color:var(--accent);stroke:var(--accent)}
 main{padding:20px 16px calc(var(--nav) + 32px + env(safe-area-inset-bottom,0px))}.topbar{padding:0 16px}
 .rail{grid-auto-columns:minmax(150px,44vw)}#uname{display:none}}
/* game */
#game{position:fixed;inset:0;z-index:100;display:none;background:#9ad7ff;touch-action:none;user-select:none;-webkit-user-select:none}
#game.open{display:block}#canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}.hud>*{pointer-events:auto}
.hud-title{font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);margin-right:auto}
.hud button{height:40px;padding:0 14px;border:0;border-radius:var(--r);background:rgba(20,22,28,.72);color:#fff;font:600 14px var(--font);cursor:pointer}
.hud button.on{background:var(--accent)}
#g-stat{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:12px;padding:6px 12px;border-radius:8px;background:rgba(20,22,28,.65);color:#fff;font-weight:700}
.swatches{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px;border-radius:12px;background:rgba(20,22,28,.6)}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
.pad{display:none;position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));grid-template:repeat(3,52px)/repeat(3,52px);gap:4px}
.pad button,.jump{border:0;border-radius:12px;background:rgba(20,22,28,.6);color:#fff;font-size:20px;touch-action:none}
.jump{display:none;position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;font:700 14px var(--font)}
#game:not([data-g="builder"]) .swatches,#game:not([data-g="builder"]) #g-mode{display:none}
@media (pointer:coarse){.pad{display:grid}.swatches{left:auto;right:16px;transform:none;flex-direction:column}#game[data-g="obby"] .jump{display:block}}
.shop{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.fig{width:100%;max-width:180px;height:auto}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px}
.item .btn,.item .btn-2{margin-top:8px;width:100%}.item button:disabled{opacity:.55;cursor:default}
.prev{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;color:var(--muted);font-weight:600}
.tag.price{left:auto;right:8px;background:var(--play)}
.packs{display:grid;gap:10px;margin:16px 0}.packs button{height:48px}
@media (max-width:700px){.shop{grid-template-columns:1fr}}
.crown{width:1.1em;height:1.1em;vertical-align:-.15em;margin-right:3px;fill:#f5c518;stroke:#b8860b;stroke-width:1}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;max-width:720px}
.post h2{margin:6px 0 8px}.post p{margin:0 0 10px;max-width:62ch}.post time{color:var(--muted);font-size:12px}
.tag2{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:10px;background:var(--hover);font-size:11px;font-weight:600}
.banner{display:block;margin-bottom:24px;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--text);text-decoration:none}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">RoBlocks</span>
  <input class="search" id="q" type="search" placeholder="Search games" aria-label="Search games">
  <div class="userbar" id="userbar"></div>
</header>
<div class="shell">
  <aside class="sidebar"><nav aria-label="Primary"><ul class="nav">
    <li><a href="#/home" data-r="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a></li>
    <li><a href="#/discover" data-r="discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a></li>
    <li><a href="#/avatar" data-r="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Avatar</a></li>
    <li><a href="#/news" data-r="news"><svg viewBox="0 0 24 24"><path d="M5 4h11v16H5zM16 9h3v9a2 2 0 01-2 2M8 8h5M8 12h5M8 16h5"/></svg>News</a></li>
    <li><a href="#/create" data-r="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Create</a></li>
  </ul></nav></aside>
  <main id="view"></main>
</div>

<dialog class="dlg" id="modal" aria-labelledby="m-title">
  <div class="modal-thumb" id="m-thumb"></div>
  <div class="pad-b"><h2 id="m-title"></h2><p class="muted" id="m-meta"></p><p id="m-desc" style="margin:0 0 20px"></p>
  <button class="btn-play" id="m-play" type="button">PLAY</button><button class="btn-ghost" id="m-close" type="button">Close</button></div>
</dialog>

<dialog class="dlg" id="auth" aria-label="Log in or sign up">
  <div class="tabs"><button type="button" id="t-in" class="on">Log in</button><button type="button" id="t-up">Sign up</button></div>
  <div class="pad-b"><form id="auth-form" autocomplete="on">
    <label class="field">Display name<input class="in" id="a-name" required minlength="3" maxlength="20" autocomplete="username"><small>3–20 letters, numbers or underscores</small></label>
    <label class="field">Password<input class="in" id="a-pass" type="password" required minlength="6" autocomplete="current-password"></label>
    <label class="field" id="a-mail-w" hidden>Email (optional)<input class="in" id="a-mail" type="email" autocomplete="email"><small>Only used to help recover your account</small></label>
    <label class="field" id="a-body-w" hidden>Starting avatar<select class="in" id="a-body"><option value="male">Male look</option><option value="female">Female look</option></select></label>
    <div class="err" id="a-err" role="alert"></div>
    <button class="btn-play" id="a-go" type="submit" style="height:48px;font-size:17px">Log in</button>
    <button class="btn-ghost" id="a-x" type="button">Cancel</button>
  </form></div>
</dialog>

<dialog class="dlg" id="bucks" aria-label="Get Ro-Bucks"><div class="pad-b"><h2>Get Ro-Bucks</h2><p class="muted" id="b-note"></p>
  <div class="packs" id="packs"><button class="btn" data-n="100">+100 R$</button><button class="btn" data-n="500">+500 R$</button><button class="btn" data-n="1000">+1,000 R$</button></div>
  <small class="muted">Demo mode: test Ro-Bucks are free and no payment is taken.</small><button class="btn-ghost" id="b-x" type="button">Close</button></div></dialog>

<div id="game" role="dialog" aria-label="Game">
  <canvas id="canvas"></canvas>
  <div class="hud"><span class="hud-title" id="g-title"></span><button id="g-mode" type="button">Mode: Place</button><button id="g-exit" type="button">Exit</button></div>
  <div id="g-stat"></div>
  <div class="swatches" id="swatches"></div>
  <div class="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><span></span><button data-d="1,0">▶</button><span></span><button data-d="0,1">▼</button><span></span></div>
  <button class="jump" id="jump" type="button">JUMP</button>
</div>

<script>
/* ===== helpers + storage (per-device; see notes on real accounts) ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
            set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};
const GRADS = ['linear-gradient(135deg,#6aa8ff,#2f6bff)','linear-gradient(135deg,#ffb56a,#ff6a5c)','linear-gradient(135deg,#7be0a8,#1fa37a)','linear-gradient(135deg,#c79bff,#6a4cff)','linear-gradient(135deg,#ffe27a,#ffa63d)','linear-gradient(135deg,#7adfe8,#2b8fb5)'];
const GENRES = {builder:'Builder', shooter:'Shooter', obby:'Obby'};
const mk = (id, title, genre, diff, c, desc, price = 0) => ({id, title, genre, diff, c, desc, price, author:'RoBlocks'});
const BASE = [
  mk('arena-strike','Arena Strike','shooter',2,1,'Survive waves of enemies. Tap or click to fire.'),
  mk('sky-island','Sky Island Tycoon','builder',2,0,'A sandbox to build floating islands.'),
  mk('lava-escape','Lava Escape','obby',2,4,'Jump across platforms to reach the gold finish.'),
  mk('zombie-yard','Zombie Yard','shooter',3,2,'Hard mode. Lots of enemies, little room.',50),
  mk('castle-builders','Castle Builders','builder',1,3,'Stack blocks to design your castle.'),
  mk('sky-parkour','Sky Parkour','obby',3,5,'Long course with tight gaps.',25)];
const userGames = () => LS.get('rb_games', []);
const allGames = () => [...userGames(), ...BASE];
const findGame = id => allGames().find(g => g.id === id);
const getUsers = () => LS.get('rb_users', {});
const me = () => { const k = LS.get('rb_session', null); const u = k && getUsers()[k]; if (u) { u.bucks ??= 100; u.owned ??= []; u.avatar ??= {}; u.body ??= 'male'; } return u || null; };
const saveUser = u => { const all = getUsers(); all[u.name.toLowerCase()] = u; LS.set('rb_users', all); };
/* ===== avatar items: price 0 = free, otherwise cost in Ro-Bucks (R$) ===== */
const SLOTS = {skin:'Avatars', hair:'Hair', shirt:'Shirts', pants:'Pants', hat:'Hats'};
const HAT = {cap:[.42,.1], crown:[.4,.16], tall:[.3,.34]};
const ITEMS = [
 ['skin-white','skin','Classic White',0,'#f4f4f4'],['skin-tan','skin','Tan',0,'#f1c27d'],['skin-light','skin','Light',0,'#ffdbac'],['skin-dark','skin','Deep',0,'#8d5524'],
 ['skin-zombie','skin','Zombie',150,'#7bb661'],['skin-robot','skin','Robot',300,'#b0bec5'],['skin-gold','skin','Golden',500,'#ffd700'],
 ['hair-none','hair','Bald',0,null],['hair-brown','hair','Messy Brown',0,'#8a4b24','messy'],['hair-red','hair','Red Bun',0,'#c8441c','bun'],['hair-black','hair','Short Black',0,'#1f1f24','messy'],
 ['hair-blonde','hair','Blonde Bun',60,'#e8c158','bun'],['hair-pink','hair','Pink Messy',120,'#ff7eb6','messy'],
 ['shirt-jacket','shirt','Black Jacket & Tee',0,'#1d1d22',null,{under:'#2f6fa8'}],['shirt-denim','shirt','Denim Jacket',0,'#2f5f95',null,{under:'#eef0f3',stripe:'#9aa3b2'}],
 ['shirt-white','shirt','White Tee',0,'#f5f5f5'],['shirt-red','shirt','Red Tee',0,'#e74c3c'],['shirt-blue','shirt','Blue Hoodie',50,'#2f6bff'],
 ['shirt-black','shirt','Black Jacket',75,'#222831'],['shirt-purple','shirt','Purple Hoodie',100,'#8e44ad'],['shirt-neon','shirt','Neon Vest',200,'#39ff14'],
 ['pants-dark','pants','Dark Jeans',0,'#2a2f33',null,{shoe:'#f2f2f2'}],['pants-maroon','pants','Maroon Pants',0,'#7b2d3b',null,{shoe:'#1a1a1a'}],
 ['pants-jeans','pants','Jeans',0,'#3b5b92'],['pants-black','pants','Black Pants',0,'#2d2d2d'],['pants-khaki','pants','Khakis',40,'#c2b280'],['pants-camo','pants','Camo',120,'#556b2f'],
 ['hat-none','hat','No Hat',0,null],['hat-cap','hat','Red Cap',60,'#d63031','cap'],['hat-wizard','hat','Wizard Hat',250,'#6c5ce7','tall'],['hat-crown','hat','Gold Crown',400,'#f1c40f','crown']
].map(([id, slot, name, price, color, style, x]) => ({id, slot, name, price, color, style, ...x}));
const DEFS = {
  male:   {skin:'skin-white', hair:'hair-brown', shirt:'shirt-jacket', pants:'pants-dark',   hat:'hat-none'},
  female: {skin:'skin-white', hair:'hair-red',   shirt:'shirt-denim',  pants:'pants-maroon', hat:'hat-none'}};
const item = id => ITEMS.find(i => i.id === id);
const outfit = () => { const u = me(); return {...(DEFS[u?.body] || DEFS.male), ...(u?.avatar || {})}; };
/* owner rank: any account named RoBlocks gets the crown */
const CROWN = '<svg class="crown" viewBox="0 0 24 24" role="img" aria-label="Owner"><title>Owner</title><path d="M3 18l-1-11 5 4 5-8 5 8 5-4-1 11z"/></svg>';
const isOwner = n => String(n).toLowerCase() === 'roblocks';
const who = n => (isOwner(n) ? CROWN : '') + esc(n);
const norm = n => n.toLowerCase().replace(/[_\s]/g, '').replace(/0/g, 'o').replace(/[1il|]/g, 'l');
const figure = o => {
  const I = s => item(o[s]), sk = I('skin').color, sh = I('shirt'), pa = I('pants'), hr = I('hair'), h = I('hat'), [hw, hh] = h.style ? HAT[h.style] : [0, 0];
  const r = (x, y, w, ht, f, rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${ht}" rx="${rx}" fill="${f}"/>`;
  const hair = !hr.color ? '' : hr.style === 'bun'
    ? `<circle cx="60" cy="16" r="9" fill="${hr.color}"/>${r(40,18,40,14,hr.color,7)}${r(40,22,7,22,hr.color,3)}${r(73,22,7,22,hr.color,3)}`
    : `${r(40,16,40,16,hr.color,7)}${r(40,22,9,16,hr.color,3)}${r(48,26,18,7,hr.color)}`;
  const under = sh.under ? r(50, 68, 20, 58, sh.under) + (sh.stripe ? [0,1,2,3,4].map(i => r(50, 74 + i * 11, 20, 4, sh.stripe)).join('') : '') : '';

      ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), mat(0x7ec850)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
      const gr = new THREE.GridHelper(40, 40, 0x2f6b2f, 0x2f6b2f); gr.position.y = .01; scene.add(gr);
    }
    mode = modes[g.genre](g); $('game').dataset.g = g.genre; $('g-title').textContent = g.title;
    camera.position.set(0, 9, 9); $('game').classList.add('open'); document.body.classList.add('playing'); resize(); clock.start(); loop();
  }
  function stop() { cancelAnimationFrame(raf); $('game').classList.remove('open'); document.body.classList.remove('playing'); pad.x = pad.z = 0; }
  return {start, stop};
})();

/* ===== Ro-Bucks wallet + shop (DEMO: balances live in this browser; no real payments) ===== */
function spend(cost, key) {
  const u = me();
  if (u.bucks < cost) { openBucks(`You need ${cost - u.bucks} more Ro-Bucks.`); return false; }
  u.bucks -= cost; u.owned.push(key); saveUser(u); userbar(); return true;
}
function openBucks(msg = 'Pick a pack to add to your balance.') { requireAuth(() => { $('b-note').textContent = msg; $('bucks').showModal(); }); }
$('packs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const u = me(); u.bucks += +b.dataset.n; saveUser(u); userbar(); $('bucks').close(); render();
});
$('b-x').onclick = () => $('bucks').close();
function itemAction(id) {
  requireAuth(() => {
    const i = item(id); let u = me();
    if (i.price && !u.owned.includes(id) && !spend(i.price, id)) return;
    u = me(); u.avatar[i.slot] = id; saveUser(u); userbar(); render();
  });
}

function setBody(b) { requireAuth(() => { const u = me(); u.body = b; u.avatar = {}; saveUser(u); render(); }); }

userbar(); render();
</script>
